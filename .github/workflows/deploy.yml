name: Test and deploy CSQuest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csquest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: csquest_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: csquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csquest_test -d csquest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://csquest_test:ci_test_only@127.0.0.1:5432/csquest_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Check browser and server syntax
        run: |
          node --check apps/web/public/app.js
          node --check apps/web/public/podcasts.js
          node --check src/platform/podcasts.mjs
          node --check scripts/build-podcasts.mjs
          node --check apps/web/public/experience-ui.js
          node --check apps/web/public/activity-calendar.js
          node --check apps/web/public/lesson-journey-ui.js
          node --check apps/web/public/toc-art.js
          node --check apps/web/public/toc-labs.js
          node --check packages/learning/toc-models.js
          node --check packages/learning/compiler-models.js
          node --check apps/web/public/compiler-art.js
          node --check apps/web/public/compiler-labs.js
          node --check courses/cd/authoring/build-reviewed.mjs
          node --check courses/cd/authoring/assessments.js
          node --check tests/compiler-regression.cjs
          node --check courses/toc/authoring/build-reviewed.mjs
          node --check courses/toc/authoring/assessments.js
          node --check apps/web/public/os-labs.js
          node --check courses/os/authoring/build-reviewed.mjs
          node --check courses/os/authoring/topics.js
          node --check packages/learning/lesson-journey.js
          node --check apps/web/public/theme-init.js
          node --check apps/web/public/social-ui.js
          node --check packages/learning/activity.js
          node --check apps/web/public/learning-path.js
          node --check scripts/server.mjs
          node --check src/platform/server.mjs
          node --check src/platform/social.mjs
          node --check apps/web/public/library.js
          node --check src/platform/library.mjs
          node --check src/platform/library-access.mjs
          node --check src/platform/library-files.mjs
          node --check src/platform/library-tools.mjs
          node --check src/platform/platform-tools.mjs
          node --check src/platform/permissions.mjs
          node --check apps/web/public/platform-ui.js
          node --check apps/web/public/library-organizer.js
          node --check apps/web/public/explorer-layout.js
          node --check apps/web/public/explorer-context-menu.js
          node --check apps/web/public/library-notepad.js
          node --check apps/web/public/public-explorer.js
          node --check apps/web/public/public-upload-queue.js
          node --check apps/web/public/shell-controls.js
          node --check src/platform/public-library.mjs
          node --check src/platform/library-scope.mjs
          node --check apps/web/public/library-access.js
          node --check apps/web/public/library-share.js
          node --check src/platform/storage.mjs
          node --check scripts/library-storage.mjs
          node --check src/platform/remote-sessions.mjs
          node --check src/platform/remote-broker-client.mjs
          node --check apps/web/public/remote-session.js
          node --check apps/web/public/remote-launchers.js
          node --check deploy/remote-broker.mjs
          bash -n deploy/deploy-release.sh
          bash -n deploy/configure-pipeline.sh
          bash -n deploy/configure-library.sh
          bash -n deploy/configure-library-transfers.sh
          bash -n deploy/configure-remote.sh
          bash -n deploy/configure-remote-proxy.sh
          bash -n deploy/remote-network.sh
          bash -n deploy/update-remote-firefox.sh
      - run: npm run validate
      - run: npm test
      - run: python3 tests/podcast_speech_test.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://130.162.38.87/
    steps:
      - name: Deploy the tested commit
        env:
          DEPLOY_KEY: ${{ secrets.CSQUEST_DEPLOY_KEY }}
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$RUNNER_TEMP/csquest-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/csquest-ssh/key"
          chmod 600 "$RUNNER_TEMP/csquest-ssh/key"
          printf '%s\n' '130.162.38.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPkyD3csBh5zRPEwQ/vAY2uPHsABhDvUpSsi3WTbaXP' > "$RUNNER_TEMP/csquest-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/csquest-ssh/key" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/csquest-ssh/known_hosts" \
            csquest-deploy@130.162.38.87 "$DEPLOY_COMMIT"
      - name: Check public HTTPS
        run: curl --fail --retry 5 --retry-connrefused https://130.162.38.87/api/account/session
