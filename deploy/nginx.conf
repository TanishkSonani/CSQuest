# Replace csquest.example.com with your domain before enabling this site.
# Certbot adds TLS and an HTTP-to-HTTPS redirect after DNS is configured.
server {
    listen 80;
    server_name csquest.example.com;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied forwarding headers for account rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
